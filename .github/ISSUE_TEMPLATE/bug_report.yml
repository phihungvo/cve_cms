# Example: bug_report.md

name: 🐛 Bug Report
description: Report bugs for the dev team to check and fix
title: "[BUG] "
labels: [bug]
assignees: ""

body:
  - type: markdown
    attributes:
      value: "Báo cáo các lỗi để nhóm phát triển có thể kiểm tra và sửa chữa. Hãy cung cấp thông tin bên dưới để giúp chúng tôi hiểu rõ hơn về vấn đề bạn gặp phải."

  - type: input
    id: steps
    attributes:
      label: "Các bước để tái hiện lỗi"
      description: "Ghi rõ từng bước dẫn tới lỗi"
      placeholder: "1. Mở app\n2. Bấm nút XYZ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Kết quả mong đợi"
      description: "Bạn mong đợi điều gì sẽ xảy ra?"
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: "Kết quả thực tế"
      description: "Điều gì đã xảy ra thực tế?"
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: "Môi trường"
      placeholder: "Ví dụ: iOS 17, Chrome 122.0.0, Ubuntu 22.04..."
