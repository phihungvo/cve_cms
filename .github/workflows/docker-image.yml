name: Build and Publish image to Docker Hub

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"] # Lắng nghe tất cả các nhánh cho pull request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up executable permissions for scripts
        run: chmod +x ./docker/build.sh ./docker/run.sh

      - name: Build Docker Image and Run the Docker container
        run: ./docker/build.sh

      - name: Wait for container to start
        run: |
          for i in {1..10}; do
            curl -s http://localhost:8000/api/report/system/health && break
            echo "Waiting for container to start..."
            sleep 30
          done
          # Kiểm tra API health tối đa 4 lần, mỗi lần cách nhau 30 giây (tổng 120 giây)
          # Thoát vòng lặp nếu API trả về thành công (status 2xx)
          curl -f http://localhost:8000/api/report/system/health || { echo "Container failed to start after 120 seconds"; exit 1; }
        # Kiểm tra cuối cùng để đảm bảo container đã khởi động, nếu không thì thất bại

      - name: Test APIs
        run: |
          # Test API GET
          curl -f -o /dev/null -s -w "%{http_code}" http://localhost:8000/api/report/system/health | grep -q 200 || { echo "GET API failed"; exit 1; }

          # Test API POST
          curl -f -o /dev/null -s -w "%{http_code}" -X POST "http://localhost:8091?id=2024112100100043&timestamp=1749548226&lat=10.8195025&lon=106.6913659&speed=1.57&bearing=157.52&altitude=13.3&accuracy=18.63&batt=26" | grep -q 200 || { echo "POST API failed"; exit 1; }
        # -f: Thất bại nếu HTTP code không phải 2xx
        # -o /dev/null: Bỏ output body
        # -s: Silent mode
        # -w "%{http_code}": Chỉ in HTTP status code
        # grep -q 200: Kiểm tra status code 200
        # exit 1: Thoát với mã lỗi nếu test thất bại

      - name: Retag image for Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker tag docker-platform-app:latest ${{ secrets.DOCKER_HUB_USER }}/cms-platform-app:latest

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_HUB_USER }}/cms-platform-app:latest

      - name: Fail PR if build fails on non-main branch
        if: github.event_name == 'pull_request' && github.ref != 'refs/heads/main' && failure()
        run: |
          echo "Build or tests failed on non-main branch. PR cannot be merged."
          exit 1
